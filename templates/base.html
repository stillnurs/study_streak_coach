<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}Study Streak Coach{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" />
    </head>

    <body>
        <nav class="navbar navbar-expand-sm py-3">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}"><span>✦</span> Study Streak</a>
                <a class="nav-link" href="https://github.com/stillnurs/study-streak-coach" target="_blank"
                    rel="noopener noreferrer">
                    <i class="bi bi-github"></i>
                    stillnurs
                </a>
                <a href="https://profile.edx.org/u/stillnurs" class="nav-link px-3" target="_blank"
                    rel="noopener noreferrer">
                    <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"
                        style="transform: translateY(-1px);">
                        <path
                            d="M12 2L1 7l11 5 9-4.09V14a1 1 0 0 0 2 0V7.5L12 2zm7.65 8.65L12 14.12l-7.65-3.47L2.4 11.5l9.6 4.36 9.6-4.36-1.95-.85zM12 17.5c-3.15 0-6.1-1.12-8-3v4c0 1.93 3.58 3.5 8 3.5s8-1.57 8-3.5v-4c-1.9 1.88-4.85 3-8 3z" />
                    </svg>
                    <span>edX:stillnurs</span>
                </a>
                <div class="navbar-nav ms-auto flex-row gap-2">
                    <a class="nav-link px-3 {% if request.endpoint == 'index' %}active{% endif %}"
                        href="{{ url_for('index') }}">Dashboard</a>
                    <a class="nav-link px-3 {% if request.endpoint == 'history' %}active{% endif %}"
                        href="{{ url_for('history') }}">History</a>
                </div>
            </div>
        </nav>

        <main class="container pb-5">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show mt-3" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endwith %}

            {% block main %}
            {% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
