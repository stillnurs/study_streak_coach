<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Streak Coach</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        />
</head>
<body>
 	<nav class="navbar-expand-sm py-3">
        <div class="container">
            <a href="{{ url_for('index') }}"
                ><span>✦</span> Study Streak</a
            >
            <div class="ms-auto flex-row gap-2">
                <a
                    class="px-3 {% if request.endpoint == 'index' %}active{% endif %}"
                    href="{{ url_for('index') }}"
                    >Dashboard</a
                >
                <a
                    class="px-3 {% if request.endpoint == 'history' %}active{% endif %}"
                    href="{{ url_for('history') }}"
                    >History</a
                >
            </div>
        </div>
    </nav>
<main class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div
                class="alert alert-{{ category }} alert-dismissible fade show mt-3"
                role="alert"
            >
                {{ message }}
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"
                ></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block main %}
    {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
